<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code interfaces map</title>
  <desc id="desc">A diagram showing CLI, IDE, Desktop, Web, Slack, and CI connected to Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172018"/>
      <stop offset="1" stop-color="#243b2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <path d="M80 92h800M80 428h800M120 52v416M840 52v416" stroke="#79d08a" stroke-opacity=".16"/>
  <circle cx="480" cy="260" r="92" fill="#79d08a" filter="url(#shadow)"/>
  <text x="480" y="250" text-anchor="middle" fill="#0d160f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="800">Claude Code</text>
  <text x="480" y="282" text-anchor="middle" fill="#0d160f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Agent + Tools + Permissions</text>
  <g fill="none" stroke="#c4f1cd" stroke-width="3" stroke-linecap="round" stroke-opacity=".78">
    <path d="M392 224 250 148"/>
    <path d="M568 224 710 148"/>
    <path d="M388 296 248 370"/>
    <path d="M572 296 712 370"/>
    <path d="M480 168V92"/>
    <path d="M480 352v76"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" filter="url(#shadow)">
    <g transform="translate(117 96)">
      <rect width="230" height="86" rx="14" fill="#f5f4ef"/>
      <text x="24" y="36" fill="#172018" font-size="22" font-weight="800">CLI</text>
      <text x="24" y="62" fill="#58645b" font-size="15">长任务、Git、测试</text>
    </g>
    <g transform="translate(613 96)">
      <rect width="230" height="86" rx="14" fill="#f5f4ef"/>
      <text x="24" y="36" fill="#172018" font-size="22" font-weight="800">IDE</text>
      <text x="24" y="62" fill="#58645b" font-size="15">边看文件边提问</text>
    </g>
    <g transform="translate(117 328)">
      <rect width="230" height="86" rx="14" fill="#f5f4ef"/>
      <text x="24" y="36" fill="#172018" font-size="22" font-weight="800">Desktop / Web</text>
      <text x="24" y="62" fill="#58645b" font-size="15">图形界面、远程访问</text>
    </g>
    <g transform="translate(613 328)">
      <rect width="230" height="86" rx="14" fill="#f5f4ef"/>
      <text x="24" y="36" fill="#172018" font-size="22" font-weight="800">Slack / CI</text>
      <text x="24" y="62" fill="#58645b" font-size="15">团队协作与自动化</text>
    </g>
    <g transform="translate(365 48)">
      <rect width="230" height="72" rx="14" fill="#233a29" stroke="#79d08a" stroke-opacity=".55"/>
      <text x="115" y="31" text-anchor="middle" fill="#c4f1cd" font-size="18" font-weight="800">共享模型</text>
      <text x="115" y="54" text-anchor="middle" fill="#bab8af" font-size="14">上下文、权限、工具</text>
    </g>
    <g transform="translate(365 400)">
      <rect width="230" height="72" rx="14" fill="#233a29" stroke="#79d08a" stroke-opacity=".55"/>
      <text x="115" y="31" text-anchor="middle" fill="#c4f1cd" font-size="18" font-weight="800">选择依据</text>
      <text x="115" y="54" text-anchor="middle" fill="#bab8af" font-size="14">任务节奏与权限边界</text>
    </g>
  </g>
