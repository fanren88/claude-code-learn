<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code settings precedence</title>
  <desc id="desc">A stacked precedence diagram for Managed, command line, local, project, and user settings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172018"/>
      <stop offset="1" stop-color="#263528"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="76" fill="#f5f4ef" font-size="30" font-weight="850">settings 优先级</text>
    <text x="80" y="108" fill="#bab8af" font-size="16">上层覆盖下层；团队共享规则和个人本地覆盖要分开管理。</text>
    <g transform="translate(150 142)">
      <rect width="660" height="62" rx="12" fill="#79d08a"/>
      <text x="28" y="39" fill="#0d160f" font-size="20" font-weight="850">1. Managed settings</text>
      <text x="632" y="39" text-anchor="end" fill="#0d160f" font-size="15" font-weight="700">组织强制</text>
    </g>
    <g transform="translate(180 214)">
      <rect width="600" height="58" rx="12" fill="#c4f1cd"/>
      <text x="28" y="37" fill="#172018" font-size="19" font-weight="800">2. Command line flags</text>
      <text x="572" y="37" text-anchor="end" fill="#29422e" font-size="15" font-weight="700">本次命令</text>
    </g>
    <g transform="translate(210 282)">
      <rect width="540" height="58" rx="12" fill="#f2c86b"/>
      <text x="28" y="37" fill="#172018" font-size="19" font-weight="800">3. .claude/settings.local.json</text>
      <text x="512" y="37" text-anchor="end" fill="#46370f" font-size="15" font-weight="700">勿提交</text>
    </g>
    <g transform="translate(240 350)">
      <rect width="480" height="58" rx="12" fill="#e58f67"/>
      <text x="28" y="37" fill="#172018" font-size="19" font-weight="800">4. .claude/settings.json</text>
      <text x="452" y="37" text-anchor="end" fill="#4b2619" font-size="15" font-weight="700">团队共享</text>
    </g>
    <g transform="translate(270 418)">
      <rect width="420" height="58" rx="12" fill="#f5f4ef"/>
      <text x="28" y="37" fill="#172018" font-size="19" font-weight="800">5. ~/.claude/settings.json</text>
      <text x="392" y="37" text-anchor="end" fill="#58645b" font-size="15" font-weight="700">个人默认</text>
    </g>
    <path d="M833 154v310" stroke="#c4f1cd" stroke-width="3" stroke-linecap="round"/>
    <path d="m833 154-12 18M833 154l12 18" stroke="#c4f1cd" stroke-width="3" stroke-linecap="round"/>
    <text x="860" y="238" fill="#c4f1cd" font-size="15" font-weight="750" transform="rotate(90 860 238)">更高优先级</text>
  </g>
</svg>
