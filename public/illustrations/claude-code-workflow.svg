<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code agent workflow</title>
  <desc id="desc">A diagram showing the loop from user goal to Claude Code, tools, approval, files, and verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172018"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79D08A"/>
      <stop offset="1" stop-color="#73A7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#79D08A"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <path d="M0 132h1200M0 260h1200M0 388h1200M0 516h1200M160 0v680M320 0v680M480 0v680M640 0v680M800 0v680M960 0v680" stroke="#2C3830" stroke-width="1" opacity=".55"/>
  <text x="64" y="78" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Claude Code workflow</text>
  <text x="64" y="114" fill="#BAB8AF" font-family="Inter, Arial, sans-serif" font-size="18">Describe, inspect, approve, verify</text>

  <g filter="url(#shadow)">
    <rect x="80" y="230" width="190" height="116" rx="18" fill="#202922" stroke="#3A4C3D"/>
    <text x="114" y="278" fill="#F2C86B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">1. Goal</text>
    <text x="114" y="310" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">User request</text>

    <rect x="350" y="206" width="220" height="164" rx="20" fill="#1C2529" stroke="#79D08A"/>
    <text x="388" y="258" fill="#79D08A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">2. Agent loop</text>
    <text x="388" y="293" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Claude Code</text>
    <text x="388" y="328" fill="#BAB8AF" font-family="Inter, Arial, sans-serif" font-size="16">plans next action</text>

    <rect x="670" y="110" width="190" height="104" rx="16" fill="#202922" stroke="#45514A"/>
    <text x="704" y="154" fill="#73A7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Tools</text>
    <text x="704" y="184" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="17">Read · Grep · Bash</text>

    <rect x="670" y="380" width="190" height="104" rx="16" fill="#202922" stroke="#45514A"/>
    <text x="704" y="424" fill="#E58F67" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Approval</text>
    <text x="704" y="454" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="17">allow or reject</text>

    <rect x="950" y="170" width="170" height="116" rx="18" fill="#202922" stroke="#3A4C3D"/>
    <text x="982" y="216" fill="#F2C86B" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Files</text>
    <text x="982" y="248" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="17">diffs &amp; edits</text>

    <rect x="950" y="350" width="170" height="116" rx="18" fill="#202922" stroke="#3A4C3D"/>
    <text x="982" y="396" fill="#79D08A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Verify</text>
    <text x="982" y="428" fill="#F5F4EF" font-family="Inter, Arial, sans-serif" font-size="17">tests &amp; review</text>
  </g>

  <path d="M270 288h72" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 252c44-92 74-92 94-92" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M570 324c42 92 74 108 94 108" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 162c44 14 58 38 84 60" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M860 432h82" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1035 350c-18-44-18-58 0-64" stroke="#79D08A" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 408c-226 126-434 138-510-30" stroke="#73A7FF" stroke-width="3" fill="none" stroke-dasharray="9 10" marker-end="url(#arrow)"/>

  <rect x="80" y="560" width="1040" height="58" rx="14" fill="#121A16" stroke="#2C3830"/>
  <text x="112" y="596" fill="#BAB8AF" font-family="Inter, Arial, sans-serif" font-size="18">Key idea: Claude Code is a controlled loop. You stay in charge when tools, files, commands, or risk are involved.</text>
</svg>
